name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 試合・順位・ハイライトは日中も動くので、6時間ごとに作り直す。
  # 1日1回だった頃は、日中ずっと前の晩のデータを出していた。
  # UTC 0/6/12/18 = JST 9時／15時／21時／翌3時。
  # 欧州の試合は JST の未明に終わるので、9時のビルドで結果が載る。
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      - name: 試合日程と順位表を取得
        # APIキーが未設定のうちはスキップされ、サンプル日程のままビルドされる
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          if [ -n "$FOOTBALL_DATA_TOKEN" ]; then
            npm run data:fixtures
            npm run data:standings
          else
            echo "FOOTBALL_DATA_TOKEN が未設定のため、サンプル日程のままビルドします"
          fi

      - name: ハイライトを取得
        # 試合の数時間後に投稿されるため、日程と同じ頻度で取り直す。
        # 取得できなければ、リポジトリにある前回の内容のままビルドする。
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -n "$YOUTUBE_API_KEY" ]; then
            npm run data:highlights
          else
            echo "YOUTUBE_API_KEY が未設定のため、前回のハイライトのままビルドします"
          fi

      - name: ビルド
        env:
          NEXT_PUBLIC_SITE_URL: https://kaigai-gumi.com
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ secrets.ADSENSE_CLIENT }}
          NEXT_PUBLIC_CONTACT_FORM_URL: ${{ secrets.CONTACT_FORM_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          NEXT_PUBLIC_AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          NEXT_PUBLIC_RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          NEXT_PUBLIC_AFFILIATE_MOSHIMO_RAKUTEN: ${{ secrets.AFFILIATE_MOSHIMO_RAKUTEN }}
          NEXT_PUBLIC_AFFILIATE_UNEXT: ${{ secrets.AFFILIATE_UNEXT }}
          NEXT_PUBLIC_AFFILIATE_DAZN: ${{ secrets.AFFILIATE_DAZN }}
          NEXT_PUBLIC_AFFILIATE_WOWOW: ${{ secrets.AFFILIATE_WOWOW }}
          NEXT_PUBLIC_AFFILIATE_ABEMA: ${{ secrets.AFFILIATE_ABEMA }}
          NEXT_PUBLIC_AFFILIATE_CELTIC: ${{ secrets.AFFILIATE_CELTIC }}
        run: npm run build

      - name: Jekyll の処理を無効化
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
